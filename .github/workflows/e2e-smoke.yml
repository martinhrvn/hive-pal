name: E2E Smoke

# Runs the Playwright smoke suite (apps/e2e/tests/smoke) against a deployed
# Hive Pal instance.
#
# Automatic: Coolify keeps one comment per PR updated with the preview state
# ("The preview deployment ... is ready"). GitHub delivers that as an
# issue_comment event, which starts this workflow against the preview domain in
# the comment body. Only the Coolify bot's comment counts; a push that deploys
# again cancels the previous run and starts a new one.
#
# By hand, once a preview is up:
#
#   gh workflow run e2e-smoke.yml -f base_url=https://243.preview.hivepal.app
#
# The repository_dispatch trigger is kept for the main preview webhook.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to test (frontend and /api on the same host)'
        required: true
        default: 'https://preview.hivepal.app'
      grep:
        description: 'Regex over test titles/tags, e.g. @journey|@core (empty = all)'
        required: false
        default: '@journey|@core'
      workers:
        description: 'Parallel workers'
        required: false
        default: '2'
  repository_dispatch:
    types: [preview-deployed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A newer deployment of the same PR cancels the run in progress. Kept at job
    # level so a run skipped by the filter below never cancels a real one.
    concurrency:
      group: e2e-smoke-${{ github.event.issue.number || inputs.base_url || github.event.client_payload.base_url || 'main-preview' }}
      cancel-in-progress: true
    # Only the Coolify bot's "preview deployment ... is ready" comment on a pull
    # request starts a run. Every other comment, and comments on issues, are
    # ignored. Rename the bot in one place with the COOLIFY_COMMENT_AUTHOR repo
    # variable if the Coolify GitHub App is ever reinstalled.
    if: >
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == (vars.COOLIFY_COMMENT_AUTHOR || 'enchanting-eel-x0c8gcg[bot]') &&
        contains(github.event.comment.body, 'is ready') &&
        contains(github.event.comment.body, '.preview.hivepal.app')
      )

    steps:
      - name: Resolve target
        env:
          DISPATCH_BASE_URL: ${{ inputs.base_url || github.event.client_payload.base_url }}
          DISPATCH_GREP: ${{ inputs.grep || github.event.client_payload.grep }}
          DISPATCH_WORKERS: ${{ inputs.workers || github.event.client_payload.workers }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          base_url="$DISPATCH_BASE_URL"
          if [ -z "$base_url" ] && [ -n "$COMMENT_BODY" ]; then
            base_url="$(printf '%s\n' "$COMMENT_BODY" \
              | grep -oE 'https://[A-Za-z0-9._-]+\.preview\.hivepal\.app' | head -1 || true)"
          fi
          if [ -z "$base_url" ]; then
            echo "::error::No preview URL in the trigger: pass base_url, a client_payload.base_url, or comment from Coolify"
            exit 1
          fi
          # A Coolify comment carries no options, so it gets the default slice.
          grep_expr="$DISPATCH_GREP"
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            grep_expr="${DISPATCH_GREP:-@journey|@core}"
          fi
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "SMOKE_GREP=$grep_expr" >> "$GITHUB_ENV"
          echo "SMOKE_WORKERS=${DISPATCH_WORKERS:-2}" >> "$GITHUB_ENV"
          echo "Testing $base_url (trigger: $GITHUB_EVENT_NAME, grep: ${grep_expr:-all})"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For a Coolify comment, test with the pull request's suite.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build page objects
        run: pnpm --filter page-objects build

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Wait for the deployment to answer
        run: |
          # Coolify writes its comment once the preview is up, so this is only a
          # short settle wait, not the readiness signal. Gate on the app root:
          # /api/health can answer 503 on a preview whose database and UI are
          # fine (the per-PR stack reports a disk-threshold failure), and it
          # would block the run.
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/" || true)"
            if [ "$code" = "200" ]; then
              health="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/api/health" || true)"
              echo "$BASE_URL answers 200 (health: $health, not a gate)"
              exit 0
            fi
            echo "attempt $i: $BASE_URL/ answered $code, retrying in 10s"
            sleep 10
          done
          echo "::error::$BASE_URL/ did not answer 200"
          exit 1

      - name: Run smoke tests
        env:
          CI: true
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: pnpm --filter e2e test:smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-test-results-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const baseUrl = process.env.BASE_URL;
            const status = process.env.JOB_STATUS;
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let counts = '';
            try {
              const xml = fs.readFileSync('apps/e2e/test-results/junit.xml', 'utf8');
              const m = xml.match(/<testsuites[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*skipped="(\d+)"/);
              if (m) counts = ` — ${m[1]} tests, ${m[2]} failed, ${m[3]} skipped`;
            } catch {}

            const marker = '<!-- e2e-smoke -->';
            const body = `${marker}\n${emoji} **E2E smoke** on ${baseUrl} **${status}**${counts}\n\nGrep: \`${process.env.SMOKE_GREP || 'all'}\` · [Run and artifacts](${runUrl})`;

            // PR previews live at https://<PR>.preview.hivepal.app
            const pr = baseUrl.match(/^https:\/\/(\d+)\.preview\.hivepal\.app/);
            if (pr) {
              const issue_number = Number(pr[1]);
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
                });
              }
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha, body,
              });
            }
