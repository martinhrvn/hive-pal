name: E2E Smoke

# Runs the Playwright smoke suite (apps/e2e/tests/smoke) against a deployed
# Hive Pal instance.
#
# Automatic: every push to a pull request starts a run. Coolify deploys the
# same push to https://<PR>.preview.hivepal.app; the run waits until that
# preview's /api/version reports the pushed commit, then tests it. A newer
# push cancels the run in progress.
#
# By hand, once a preview is up:
#
#   gh workflow run e2e-smoke.yml -f base_url=https://243.preview.hivepal.app
#
# The repository_dispatch trigger is kept for the main preview webhook.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to test (frontend and /api on the same host)'
        required: true
        default: 'https://preview.hivepal.app'
      grep:
        description: 'Regex over test titles/tags, e.g. @journey|@core (empty = all)'
        required: false
        default: '@journey|@core'
      workers:
        description: 'Parallel workers'
        required: false
        default: '2'
  repository_dispatch:
    types: [preview-deployed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number || inputs.base_url || github.event.client_payload.base_url || 'main-preview' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Fork PRs are skipped: they may not get a preview at all (that is up to
    # Coolify's public PR setting), and their read-only token cannot comment.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Resolve target
        env:
          DISPATCH_BASE_URL: ${{ inputs.base_url || github.event.client_payload.base_url }}
          DISPATCH_GREP: ${{ inputs.grep || github.event.client_payload.grep }}
          DISPATCH_WORKERS: ${{ inputs.workers || github.event.client_payload.workers }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_url="https://${PR_NUMBER}.preview.hivepal.app"
            # A push carries no options, so it gets the default slice.
            grep_expr="@journey|@core"
            expected_commit="$HEAD_SHA"
          else
            base_url="$DISPATCH_BASE_URL"
            grep_expr="$DISPATCH_GREP"
            expected_commit=""
          fi
          if [ -z "$base_url" ]; then
            echo "::error::No preview URL: pass base_url or a client_payload.base_url"
            exit 1
          fi
          {
            echo "BASE_URL=$base_url"
            echo "SMOKE_GREP=$grep_expr"
            echo "SMOKE_WORKERS=${DISPATCH_WORKERS:-2}"
            echo "EXPECTED_COMMIT=$expected_commit"
          } >> "$GITHUB_ENV"
          echo "Testing $base_url (trigger: $GITHUB_EVENT_NAME, grep: ${grep_expr:-all}, commit: ${expected_commit:-any})"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The pushed commit, which is what Coolify deploys, not the merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Check that the preview can report its commit
        id: version
        run: |
          # Branches cut before /api/version existed deploy without it, so the
          # wait below could never succeed. Rebasing on main fixes that.
          if [ -n "$EXPECTED_COMMIT" ] && [ ! -f apps/backend/src/health/version.controller.ts ]; then
            echo "::notice::This branch predates /api/version; rebase on main to run smoke tests automatically."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.version.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build page objects
        if: steps.version.outputs.skip != 'true'
        run: pnpm --filter page-objects build

      - name: Install Playwright browsers
        if: steps.version.outputs.skip != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Wait for the deployment
        if: steps.version.outputs.skip != 'true'
        run: |
          # With an expected commit (pull requests), wait until the preview
          # serves it: Coolify builds the same push in parallel and queues
          # previews, so allow 20 minutes. Otherwise wait for the root to
          # answer. /api/health is not a gate: it can answer 503 on a preview
          # whose database and UI are fine (the per-PR stack reports a
          # disk-threshold failure).
          for i in $(seq 1 80); do
            if [ -n "$EXPECTED_COMMIT" ]; then
              commit="$(curl -sf --max-time 10 "$BASE_URL/api/version" | jq -r '.commit // empty' 2>/dev/null || true)"
              if [ "$commit" = "$EXPECTED_COMMIT" ]; then
                echo "$BASE_URL serves $commit"
                exit 0
              fi
              echo "attempt $i: $BASE_URL serves ${commit:-nothing yet}, waiting for $EXPECTED_COMMIT"
            else
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/" || true)"
              if [ "$code" = "200" ]; then
                echo "$BASE_URL answers 200"
                exit 0
              fi
              echo "attempt $i: $BASE_URL/ answered $code"
              [ "$i" -ge 12 ] && break
            fi
            sleep 15
          done
          echo "::error::$BASE_URL did not become ready${EXPECTED_COMMIT:+ with commit $EXPECTED_COMMIT}"
          exit 1

      - name: Run smoke tests
        if: steps.version.outputs.skip != 'true'
        env:
          CI: true
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: pnpm --filter e2e test:smoke

      - name: Upload test results
        if: always() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-test-results-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always() && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Report result
        if: always() && steps.version.outputs.skip != 'true'
        # A token without write access (e.g. Dependabot) cannot comment; the
        # job summary still carries the result.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const baseUrl = process.env.BASE_URL;
            const status = process.env.JOB_STATUS;
            const commit = process.env.EXPECTED_COMMIT;
            const emoji = status === 'success' ? '✅' : '❌';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let counts = '';
            try {
              const xml = fs.readFileSync('apps/e2e/test-results/junit.xml', 'utf8');
              const m = xml.match(/<testsuites[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*skipped="(\d+)"/);
              if (m) counts = ` — ${m[1]} tests, ${m[2]} failed, ${m[3]} skipped`;
            } catch {}

            const marker = '<!-- e2e-smoke -->';
            const at = commit ? ` @ \`${commit.slice(0, 7)}\`` : '';
            const body = `${marker}\n${emoji} **E2E smoke** on ${baseUrl}${at} **${status}**${counts}\n\nGrep: \`${process.env.SMOKE_GREP || 'all'}\` · [Run and artifacts](${runUrl})`;
            await core.summary.addRaw(body.replace(marker, '')).write();

            // PR previews live at https://<PR>.preview.hivepal.app
            const fromUrl = baseUrl.match(/^https:\/\/(\d+)\.preview\.hivepal\.app/);
            const issue_number = Number(process.env.PR_NUMBER || (fromUrl && fromUrl[1]));
            if (issue_number) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
                });
              }
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha, body,
              });
            }
