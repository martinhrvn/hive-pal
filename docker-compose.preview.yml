services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - hive-pal
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Set SEED_DEMO_DATA=true to fill the admin account with demo apiaries,
      # hives and a season of data (scripts/seed-demo.ts).
      SEED_DEMO_DATA: $SEED_DEMO_DATA
      JWT_SECRET: ${JWT_SECRET}
      # Coolify suffixes compose service names with -pr-<id> for PR previews and
      # exposes the real name as SERVICE_NAME_<SERVICE>, so the host is not always "postgres".
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${SERVICE_NAME_POSTGRES:-postgres}:5432/beekeeper
      PROMETHEUS_API_KEY: ${PROMETHEUS_API_KEY:-prometheus-secret-token}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      FROM_EMAIL: noreply@hivepal.app
      # Coolify sets SERVICE_URL_<SERVICE> to the domain assigned to that service,
      # which for PR previews is the per-PR domain. The frontend is served by this
      # container, so both public URLs are the backend service URL.
      FRONTEND_URL: ${SERVICE_URL_BACKEND:-https://preview.hivepal.app}
      BETTER_AUTH_URL: ${SERVICE_URL_BACKEND:-https://preview.hivepal.app}
      # Storage Configuration
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/data/uploads}
      # S3 Storage (for audio recordings)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AUDIO_MAX_FILE_SIZE: ${AUDIO_MAX_FILE_SIZE:-52428800}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    volumes:
      - hivepal_uploads:/data/uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: beekeeper
    volumes:
      - hivepal_postgres_data_preview:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d beekeeper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hivepal_uploads:
  hivepal_postgres_data_preview:
